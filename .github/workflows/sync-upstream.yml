name: Sync from upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'Starmadebydata/rea'
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream changes into main
        env:
          # SYNC_TOKEN: fine-grained PAT with Contents + Workflows read/write on this repo.
          # The default GITHUB_TOKEN cannot merge upstream commits that touch .github/workflows.
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST repos/${{ github.repository }}/merge-upstream -f branch=main
